[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: data-heavy model retraining or degradation checks excluded from fast CI",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["pkate", "scripts", "sdf_fixer"]
omit = [
    "scripts/score_candidate_set_with_pipeline.py",
    "scripts/stage3_protonation_state_inference.py",
    "scripts/train_delta_context_model.py",
    "scripts/train_site_state_model.py",
    "scripts/train_thermo_pair_form_model.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
